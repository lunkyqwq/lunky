name: Verify save-flow patch

on:
  push:
    paths:
      - 'patches/save-flow-3.4.1/**'
      - 'tools/check_save_flow_patch.py'
      - '.github/workflows/verify-save-flow-patch.yml'
      - 'README.md'
      - 'SAVE-FLOW-TEST-PLAN.md'
  pull_request:
    paths:
      - 'patches/save-flow-3.4.1/**'
      - 'tools/check_save_flow_patch.py'
      - '.github/workflows/verify-save-flow-patch.yml'
      - 'README.md'
      - 'SAVE-FLOW-TEST-PLAN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run save-flow static regression checks
        run: python3 tools/check_save_flow_patch.py
