name: Verify save-flow patch

on:
  push:
    paths:
      - 'patches/save-flow-3.4.1/**'
      - 'tools/check_save_flow_patch.py'
      - 'tools/test_save_flow_checker.py'
      - 'tools/audit_source_provenance.py'
      - 'tools/test_source_provenance_audit.py'
      - '.github/workflows/verify-save-flow-patch.yml'
      - 'README.md'
      - 'README-zh-CN.md'
      - 'SAVE-FLOW-TEST-PLAN.md'
      - 'SOURCE-INTEGRATION-AUDIT.md'
      - 'BUILD-READINESS-REPORT.md'
  pull_request:
    paths:
      - 'patches/save-flow-3.4.1/**'
      - 'tools/check_save_flow_patch.py'
      - 'tools/test_save_flow_checker.py'
      - 'tools/audit_source_provenance.py'
      - 'tools/test_source_provenance_audit.py'
      - '.github/workflows/verify-save-flow-patch.yml'
      - 'README.md'
      - 'README-zh-CN.md'
      - 'SAVE-FLOW-TEST-PLAN.md'
      - 'SOURCE-INTEGRATION-AUDIT.md'
      - 'BUILD-READINESS-REPORT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run save-flow static regression checks
        run: python3 tools/check_save_flow_patch.py
      - name: Test checker detects regressions
        run: python3 tools/test_save_flow_checker.py
      - name: Test source provenance audit
        run: python3 tools/test_source_provenance_audit.py
