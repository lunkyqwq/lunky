name: Verify save-flow patch

on:
  push:
    paths:
      - 'patches/save-flow-3.4.1/**'
      - '.github/workflows/verify-save-flow-patch.yml'
      - 'README.md'
      - 'SAVE-FLOW-TEST-PLAN.md'
  pull_request:
    paths:
      - 'patches/save-flow-3.4.1/**'
      - '.github/workflows/verify-save-flow-patch.yml'
      - 'README.md'
      - 'SAVE-FLOW-TEST-PLAN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check save-flow source and patch helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("patches/save-flow-3.4.1/ReflexAiClient.java")
          helper_path = Path("patches/save-flow-3.4.1/apply-save-flow-patch.ps1")
          notes_path = Path("patches/save-flow-3.4.1/PATCH-NOTES.md")
          plan_path = Path("SAVE-FLOW-TEST-PLAN.md")
          source = source_path.read_text(encoding="utf-8")
          helper = helper_path.read_text(encoding="utf-8")
          notes = notes_path.read_text(encoding="utf-8")
          plan = plan_path.read_text(encoding="utf-8")

          check_world_branch = "pendingTrainingWorldStart && client.world != null"
          open_method_start = "private static void openTrainingWorldCreator"
          marker_write_call = "markFirstLaunchPrompted();"
          open_method = source[source.index(open_method_start):]

          checks = {
              "title-screen button is present": 'Reflex AI 训练存档' in source,
              "training save name is prefilled": 'TRAINING_WORLD_NAME = "Reflex AI Training"' in source,
              "first-launch marker is under the config directory": 'getConfigDir().resolve("reflexai").resolve("training-world-prompted")' in source,
              "marker write is guarded by an entered world": check_world_branch in source and marker_write_call in source[:source.index(open_method_start)],
              "opening creator does not directly write marker": marker_write_call not in open_method,
              "cancel path clears pending state": 'pendingTrainingWorldStart = false;' in source and 'client.currentScreen instanceof TitleScreen' in source,
              "patch helper creates a timestamped backup": 'Copy-Item -LiteralPath $target -Destination $backup' in helper and 'yyyyMMdd-HHmmss' in helper,
              "patch helper clearly states it does not build a JAR": 'does not build or install a JAR' in helper,
              "notes state this is source-only": 'not a compiled JAR' in notes,
              "manual test plan covers old-save protection": '旧存档保护' in plan,
          }
          for label, ok in checks.items():
              print(f"{'PASS' if ok else 'FAIL'}: {label}")
          if not all(checks.values()):
              raise SystemExit(1)
          PY
